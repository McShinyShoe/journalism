# Each top-level key is the id of one chest inventory:
#   title   Text shown at the top of the inventory (MiniMessage).
#   layout  1 to 6 rows of exactly 9 characters, one character per slot.
#           A space is an empty slot, any other character must be defined in items.
#   items   The item each layout character stands for:
#             material  Item id, for example book or minecraft:book.
#             name      Optional item name (MiniMessage).
#             lore      Optional list of lore lines (MiniMessage).

main:
  title: "Journalism"
  layout:
    - "########s"
    - "#   j   #"
    - "#########"
  items:
    "#":
      material: gray_stained_glass_pane
      name: " "
    j:
      material: book
      name: "<gold>Journals"
      lore:
        - "<white>Access the journal you have found"
    s:
      material: redstone_torch
      name: "<light_gray>Settings"
      lore:
        - "<white>Change Settings"